<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111318">
<title>UGC-Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0d0f14;--panel:#171a22;--muted:#9ba3b4;--line:#2a3040;--accent:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f5f8;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:24px 18px 18px;background:#12151c;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.wrap{max-width:1100px;margin:auto}h1{font-size:24px;margin:0 0 4px;letter-spacing:-.5px}.sub{color:var(--muted);font-size:13px}
.controls{display:flex;gap:9px;margin-top:17px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:11px;background:#202430;color:#fff;padding:12px}
input{min-width:0;flex:1}button{background:var(--accent);color:#171321;border:0;font-weight:700;padding-inline:18px}
main{max-width:1100px;margin:auto;padding:18px}.status{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.thumb{aspect-ratio:1;background:#222633;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}.placeholder{color:#747d91;font-size:12px}
.info{padding:11px}.name{font-weight:650;line-height:1.3;min-height:39px;overflow-wrap:anywhere}
.creator{color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{margin-top:10px;font-weight:700}.tag{font-size:11px;color:#c8b8ff;margin-top:3px}
.empty{color:var(--muted);padding:40px 10px;text-align:center;grid-column:1/-1}
@media(min-width:700px){header{padding-inline:28px}main{padding:26px}.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:17px}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>UGC-Tracker</h1><div class="sub">Roblox collectible catalog · Live public data</div>
<form class="controls" id="search"><input id="keyword" type="search" placeholder="Search items…" aria-label="Search items"><select id="limit" aria-label="Number of results"><option>10</option><option>30</option><option>60</option><option>120</option></select><button type="submit">Search</button></form>
</div></header>
<main><div class="status" id="status">Loading collectible items…</div><section class="grid" id="items" aria-live="polite"></section></main>
<script>
const grid=document.getElementById('items'),status=document.getElementById('status');
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(data){
 grid.innerHTML='';
 if(!data.items.length){grid.innerHTML='<div class="empty">No items found. Try another search.</div>';return;}
 for(const item of data.items){
  const card=document.createElement('article');card.className='item';
  const image=item.thumbnail_url?'<img loading="lazy" src="'+esc(item.thumbnail_url)+'" alt="'+esc(item.name)+'">':'<span class="placeholder">Thumbnail unavailable</span>';
  const price=Number.isFinite(item.lowest_price)&&item.lowest_price>0?'R$ '+item.lowest_price:(Number.isFinite(item.price)&&item.price>0?'R$ '+item.price:'Not listed');
  card.innerHTML='<div class="thumb">'+image+'</div><div class="info"><div class="name">'+esc(item.name||'Unnamed item')+'</div><div class="creator">'+esc(item.creator_name||'Creator not listed')+'</div><div class="price">'+esc(price)+'</div><div class="tag">'+(item.has_resellers?'Resellers available':'No reseller data')+'</div></div>';
  grid.appendChild(card);
 }
}
async function load(){
 status.textContent='Contacting Roblox…';grid.innerHTML='';
 const params=new URLSearchParams({keyword:document.getElementById('keyword').value,limit:document.getElementById('limit').value});
 try{
  const response=await fetch('/api/items?'+params);const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Could not load items');
  render(data);status.textContent='Showing '+data.count+' live catalog item(s).';
 }catch(error){status.textContent='Could not load the catalog: '+error.message;grid.innerHTML='<div class="empty">Try again in a moment.</div>';}
}
document.getElementById('search').addEventListener('submit',event=>{event.preventDefault();load();});
load();
</script>
</body></html>
