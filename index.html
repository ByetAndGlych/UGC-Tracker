<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111318">
<title>UGC-Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0d0f14;--panel:#171a22;--muted:#9ba3b4;--line:#2a3040;--accent:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f5f8;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:20px 16px 16px;background:#12151c;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.wrap{max-width:1100px;margin:auto}h1{font-size:24px;margin:0 0 4px;letter-spacing:-.5px}.sub{color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;margin-top:15px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:11px;background:#202430;color:#fff;padding:11px}
input{min-width:0;flex:1}button{background:var(--accent);color:#171321;border:0;font-weight:700;padding-inline:17px;cursor:pointer}
main{max-width:1100px;margin:auto;padding:16px}.status{color:var(--muted);font-size:13px;margin:0 0 13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;box-shadow:0 3px 12px #0003}
.thumb{aspect-ratio:1;background:#222633;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:contain}.placeholder{color:#747d91;font-size:12px}
.info{padding:10px}.name{font-weight:700;line-height:1.25;min-height:2.5em;overflow-wrap:anywhere;cursor:pointer;font-size:14px}
.price{margin-top:7px;font-weight:750;font-size:14px}.discount{margin-top:5px;color:#bca8ff;font-size:13px;font-weight:700}
.roblox-link{display:inline-block;margin-top:8px;color:#c8b8ff;font-size:12px;font-weight:700;text-decoration:none}.roblox-link:hover{text-decoration:underline}
.empty{color:var(--muted);padding:40px 10px;text-align:center;grid-column:1/-1}
dialog{width:min(620px,calc(100% - 24px));max-height:88vh;overflow:auto;background:#171a22;color:#f4f5f8;border:1px solid #3a4052;border-radius:18px;padding:0;box-shadow:0 20px 80px #000b}
dialog::backdrop{background:#000b}.modal-head{position:sticky;top:0;background:#171a22;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:1}
.modal-head h2{font-size:18px;margin:0}.close{background:#2a3040;color:white;padding:7px 12px}
.detail-body{padding:16px}.detail-image{width:100%;max-height:230px;object-fit:contain;background:#222633;border-radius:12px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}
.detail-cell{background:#222633;border-radius:11px;padding:10px}.detail-cell span{display:block;color:var(--muted);font-size:12px}.detail-cell strong{display:block;margin-top:3px;overflow-wrap:anywhere}
.detail-section{margin-top:17px}.detail-section h3{font-size:15px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px}
.listing{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:10px}
@media(min-width:700px){header{padding-inline:28px}main{padding:26px}.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:17px}.info{padding:12px}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>UGC-Tracker</h1><div class="sub">Roblox collectible catalog · Live public data</div>
<form class="controls" id="search"><input id="keyword" type="search" placeholder="Search items…" aria-label="Search items"><select id="limit" aria-label="Number of results"><option>10</option><option>30</option><option>60</option><option>120</option></select><button type="submit">Search</button></form>
</div></header>
<main><div class="status" id="status">Loading collectible items…</div><section class="grid" id="items" aria-live="polite"></section></main>
<dialog id="details"><div class="modal-head"><h2 id="modal-title">Item details</h2><button class="close" id="close-modal" type="button">Close</button></div><div class="detail-body" id="modal-body"></div></dialog>
<script>
const grid=document.getElementById('items'),status=document.getElementById('status'),modal=document.getElementById('details');
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function robux(value){return Number.isFinite(Number(value))&&Number(value)>0?'R$ '+Number(value).toLocaleString():'NA';}
function percentOff(price,rap){if(!(Number(price)>0)||!(Number(rap)>0))return 'NA';const p=(1-Number(price)/Number(rap))*100;return p>=0?p.toFixed(1)+'% below RAP':Math.abs(p).toFixed(1)+'% above RAP';}
function itemUrl(id){return Number(id)>0?'https://www.roblox.com/catalog/'+encodeURIComponent(id):'';}
function render(data){
 grid.innerHTML='';
 if(!data.items.length){grid.innerHTML='<div class="empty">No items found. Try another search.</div>';return;}
 for(const item of data.items){
  const card=document.createElement('article');card.className='item';
  const image=item.thumbnail_url?'<img loading="lazy" src="'+esc(item.thumbnail_url)+'" alt="'+esc(item.name)+'">':'<span class="placeholder">Thumbnail unavailable</span>';
  const price=item.lowest_price;
  const url=itemUrl(item.id);
  card.innerHTML='<div class="thumb" role="button" tabindex="0" aria-label="Details for '+esc(item.name)+'">'+image+'</div><div class="info"><div class="name" role="button" tabindex="0">'+esc(item.name||'Unnamed item')+'</div><div class="price">Lowest: '+esc(robux(price))+'</div><div class="discount"> '+esc(percentOff(price,item.rap))+'</div>'+(url?'<a class="roblox-link" href="'+url+'" target="_blank" rel="noopener noreferrer">View on Roblox ↗</a>':'')+'</div>';
  const open=()=>showDetails(item);
  card.querySelector('.thumb').addEventListener('click',open);card.querySelector('.name').addEventListener('click',open);
  card.querySelector('.thumb').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  card.querySelector('.name').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  grid.appendChild(card);
 }
}
async function showDetails(item){
 document.getElementById('modal-title').textContent=item.name||'Item details';
 document.getElementById('modal-body').innerHTML='<p class="muted">Loading item details…</p>';modal.showModal();
 try{
  const detailUrl='/api/items/'+encodeURIComponent(item.id)+'?item='+encodeURIComponent(JSON.stringify(item));const response=await fetch(detailUrl);const d=await response.json();if(!response.ok)throw new Error(d.error||'Could not load details');
  const x=d.item||{},rap=d.rap,discount=percentOff(x.lowest_price,rap),url=itemUrl(x.id);
  const soldTotal=Number.isFinite(Number(d.sales))&&Number.isFinite(Number(d.stock))&&Number(d.stock)>0?Number(d.sales).toLocaleString()+' / '+Number(d.stock).toLocaleString():'NA';
  const cells=[['Lowest price',robux(x.lowest_price)],['RAP',robux(rap)],['Discount vs RAP',discount],['Creator price',robux(x.creator_price)],['Lowest resale',robux(x.resale_price)],['Copies sold (sold / total)',soldTotal],['Original price',robux(x.raw?.originalPrice)],['Copies remaining',d.remaining??'NA']];
  let html=(x.thumbnail_url?'<img class="detail-image" src="'+esc(x.thumbnail_url)+'" alt="">':'')+'<div class="detail-grid">'+cells.map(c=>'<div class="detail-cell"><span>'+esc(c[0])+'</span><strong>'+esc(c[1])+'</strong></div>').join('')+'</div>';
  html+='<div class="detail-section"><h3>Creator</h3><p>'+esc(x.creator_name||'NA')+'</p><p class="muted">'+esc(x.description||'No description available.')+'</p></div>';
  html+='<div class="detail-section"><h3>Resale listings</h3>';
  if(d.resellers?.length){html+=d.resellers.map(r=>'<div class="listing"><span>'+esc(r.seller?.name||'Seller')+(r.serialNumber?' · #'+esc(r.serialNumber):'')+'</span><strong>'+esc(robux(r.price))+'</strong></div>').join('');}
  else html+='<p class="muted">NA — no public reseller listings returned.</p>';
  html+='</div><div class="detail-section"><h3>Price history</h3><p class="muted">'+(d.price_history?.length?esc(d.price_history.length)+' price points returned for up to 180 days.':'NA — Roblox did not return price history.')+'</p></div>';
  if(url)html+='<p><a class="roblox-link" href="'+url+'" target="_blank" rel="noopener noreferrer">Open this item on Roblox ↗</a></p>';
  document.getElementById('modal-body').innerHTML=html;
 }catch(e){document.getElementById('modal-body').innerHTML='<p class="muted">Could not load details: '+esc(e.message)+'</p>';}
}
async function load(){
 status.textContent='Contacting Roblox…';grid.innerHTML='';
 const params=new URLSearchParams({keyword:document.getElementById('keyword').value,limit:document.getElementById('limit').value});
 try{const response=await fetch('/api/items?'+params);const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not load items');render(data);status.textContent='Showing '+data.count+' live catalog item(s).';}
 catch(error){status.textContent='Could not load the catalog: '+error.message;grid.innerHTML='<div class="empty">Try again in a moment.</div>';}
}
document.getElementById('search').addEventListener('submit',event=>{event.preventDefault();load();});
document.getElementById('close-modal').addEventListener('click',()=>modal.close());
modal.addEventListener('click',e=>{if(e.target===modal)modal.close();});
load();
</script>
</body></html>
