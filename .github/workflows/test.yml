name: UGC Tracker checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest -v
      - name: Smoke-test Roblox catalog and thumbnails
        run: python web_app.py --check
